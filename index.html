<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last 5 Days · Skills Bank</title>
<style>
:root{--navy:#080828;--teal:#40BDA9;--teal-d:#1E8C7B;--ice:#EBF4FF;--coral:#F26A44;--muted:#5B6485;--line:#CBD9F2;--white:#fff;--green:#2FB67C}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--ice);color:var(--navy);font-size:16px;line-height:1.45}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header.top img{height:34px}
header.top .t{font-weight:700;font-size:18px;letter-spacing:.01em}
header.top .sub{color:var(--teal);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
header.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header.top nav a{color:#fff;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
header.top nav a.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px rgba(8,8,40,.05)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--teal);color:var(--navy)}
.btn.sec{background:var(--white);border:1px solid var(--line);color:var(--navy)}
.btn.dark{background:var(--navy);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--navy);max-width:100%}
textarea{width:100%;min-height:78px}
label{font-size:13px;font-weight:700;color:var(--teal-d);letter-spacing:.06em;text-transform:uppercase;display:block;margin:0 0 4px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.tile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.tile .k{font-size:12px;font-weight:700;color:var(--teal-d);letter-spacing:.1em;text-transform:uppercase}
.tile .v{font-size:34px;font-weight:700;line-height:1.1}.tile .d{font-size:13px;color:var(--muted)}
.tile.hid .v{color:#9AA7C7}.tile.hid{background:#F4F7FC;border-style:dashed}
.pos{color:var(--teal-d)}.neg{color:var(--coral)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--navy);cursor:pointer;margin:0 0 8px}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--teal);background:#E3F6F2}.opt.sel .l{background:var(--teal);color:var(--navy)}
.opt:disabled{cursor:default;opacity:.8}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.t{background:var(--teal);color:var(--navy)}
.code{font-family:"DejaVu Sans Mono",Consolas,monospace;font-weight:700;background:var(--ice);padding:3px 8px;border-radius:6px}
.big{font-size:54px;font-weight:700;letter-spacing:.12em}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--navy);color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
td.lab{text-align:left;font-weight:700;background:var(--ice)}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:5px solid var(--teal);background:#E3F6F2;border-radius:8px;padding:10px 14px;font-weight:700}
.bar{display:flex;align-items:end;gap:6px;height:140px}.bar div{flex:1;border-radius:6px 6px 0 0;min-height:2px}
details summary{cursor:pointer;font-weight:700}
.proj table{font-size:26px}.proj th{font-size:18px}.proj td{padding:12px}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff}
.chip.live{background:#E3F6F2;border-color:var(--teal);color:var(--teal-d)}.chip.off{background:#FFF1EC;border-color:var(--coral);color:#B2401F}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}
td.fresh select{background:#E3F6F2;border-color:var(--teal)}
@media(max-width:640px){.big{font-size:40px}h1{font-size:23px}main{padding:12px}}
</style>
</head>

/* ===================== helpers ===================== */
const BASE = {T: 82, C: 75, Tr: 75, Co: 80};
const LETTERS = ["A","B","C","D"];
const FAC_PIN = "2026";                         // code to open the facilitator pages (change it here if you want another one)
const RELAY_DEFAULT = "https://ntfy.sh/";       // free public relay used for live sync between devices
const REVEAL_DEFAULT = 2;                       // capacity / trust become visible when the group reaches round 2 (Day 4)
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn = v => v>0 ? "+"+v : (v<0 ? "\u2212"+Math.abs(v) : "0");
const cls = v => v>0 ? "pos" : (v<0 ? "neg" : "");
function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* total after applying rounds 1..upto (missing rounds are skipped) */
function totals(choices, upto){
  let T=BASE.T, C=BASE.C, Tr=BASE.Tr;
  for(let i=0;i<Math.min(upto, DATA.rounds.length);i++){
    const ch = choices[i]; if(!ch) continue;
    const o = DATA.rounds[i].options[LETTERS.indexOf(ch)]; if(!o) continue;
    T+=o.target; C+=o.capacity; Tr+=o.trust;
  }
  return {T, C, Tr, Co: BASE.Co, R: Math.round((T+C+Tr)/3)};
}
const doneCount = ch => ch.filter(Boolean).length;
const isComplete = ch => ch.length>=5 && ch.slice(0,5).every(Boolean);
function toCode(n, ch){ return "G"+n+"-"+Array.from({length:5},(_,i)=>ch[i]||"-").join("").replace(/-+$/,""); }
function fromCode(s){
  const m = /^\s*G\s*(\d{1,2})\s*-\s*([A-Da-d\-]{0,5})\s*$/i.exec(s||""); if(!m) return null;
  const arr = m[2].toUpperCase().split("").map(c=>c==="-"?null:c); while(arr.length<5) arr.push(null);
  return {n:+m[1], ch:arr};
}
function roundCode(session, r){ let h=5381; const s=(session||"").toUpperCase()+"|"+r; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return String(1000+(h%9000)); }
function copy(text, btn){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).catch(()=>{ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} t.remove(); }).finally(()=>{ if(btn){ const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>btn.textContent=o,1200);} }); }

/* ===================== state ===================== */
const randSession = () => { const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
let FAC = load("l5.fac", {session:randSession(), groups:5, cur:0, reveal:REVEAL_DEFAULT, codes:true, proj:false, choices:{}, online:{}});
FAC.online = FAC.online || {};
let GRP = load("l5.grp", {n:null, session:"", reveal:REVEAL_DEFAULT, codes:true, choices:[], unlocked:0, notes:{}, sent:{}});
GRP.sent = GRP.sent || {};
const saveFac = () => save("l5.fac", FAC), saveGrp = () => save("l5.grp", GRP);
const facChoices = n => (FAC.choices[n] = FAC.choices[n] || [null,null,null,null,null]);

/* ===================== live sync (free public relay: ntfy.sh) ===================== */
const hash6 = s => { let h=5381; for(const c of String(s)) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36).padStart(6,"0").slice(-6); };
const topicOf = s => "sb-l5-"+String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")+"-"+hash6("sb"+String(s||"").toUpperCase());
function relayBase(){ const q=new URLSearchParams(location.search).get("relay")||new URLSearchParams((location.hash.split("?")[1])||"").get("relay")||RELAY_DEFAULT; return q.endsWith("/")?q:q+"/"; }
const SYNC = {es:null, topic:"", last:null, status:"off", timer:null, session:"", role:"", seen:new Set()};
function setStatus(st){ SYNC.status=st; const el=$("#syncchip"); if(el){ el.className="chip "+(st==="live"?"live":"off"); el.textContent=st==="live"?"Live sync: connected":(st==="connecting"?"Live sync: connecting…":"Live sync: offline (use the codes)"); } }
function syncStop(){ if(SYNC.es){ SYNC.es.close(); SYNC.es=null; } clearTimeout(SYNC.timer); SYNC.status="off"; SYNC.session=""; SYNC.role=""; }
function syncStart(session, role){
  if(!session) return; if(SYNC.session===session && SYNC.role===role && (SYNC.es||SYNC.timer)) return;
  syncStop(); SYNC.session=session; SYNC.role=role; SYNC.topic=topicOf(session); SYNC.last=null; SYNC.seen=new Set(); setStatus("connecting"); syncConnect();
}
function syncConnect(){
  if(!SYNC.session) return;
  const url=relayBase()+SYNC.topic+"/sse"+(SYNC.last?("?since="+SYNC.last):"?since=all");
  let es; try{ es=new EventSource(url); }catch(e){ setStatus("off"); return; }
  SYNC.es=es;
  es.onopen=()=>{ SYNC.fail=0; setStatus("live"); };
  es.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(m.event && m.event!=="message") return; if(m.id){ if(SYNC.seen.has(m.id)) return; SYNC.seen.add(m.id); SYNC.last=m.id; } const p=JSON.parse(m.message); onSyncMessage(p); }catch(e){} };
  es.onerror=()=>{ SYNC.fail=(SYNC.fail||0)+1; setStatus(SYNC.fail>=2?"off":"connecting"); try{es.close();}catch(e){} SYNC.es=null; SYNC.timer=setTimeout(syncConnect,2500); };
}
async function syncSend(p){ if(!SYNC.topic) return false; try{ const r=await fetch(relayBase()+SYNC.topic,{method:"POST",body:JSON.stringify(Object.assign({ts:Date.now()},p))}); return r.ok; }catch(e){ return false; } }
let softTimer=null;
function softRender(){ const a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a)){ clearTimeout(softTimer); softTimer=setTimeout(softRender,1500); return; } route(); }
const FRESH = {};
function onSyncMessage(p){
  if(SYNC.role==="fac"){
    if(p.t==="hello"){ FAC.online[p.g]=p.ts||1; }
    else if(p.t==="choice" && p.g>=1 && p.g<=8){ if(p.g>FAC.groups) FAC.groups=p.g; facChoices(p.g)[p.r-1]=p.c; FRESH[p.g+"-"+(p.r-1)]=Date.now(); setTimeout(softRender,3300); }
    else if(p.t==="set" && p.g>=1 && p.g<=8){ const c=fromCode("G"+p.g+"-"+p.ch); if(c) FAC.choices[p.g]=c.ch; }
    else if(p.t==="cur"){ FAC.cur=p.cur; }
    else return;
    saveFac(); softRender();
  } else if(SYNC.role==="group" && GRP.n){
    if(p.t==="cur"){ GRP.cur=p.cur; GRP.unlocked=Math.max(GRP.unlocked,p.cur); }
    else if(p.t==="settings"){ if(p.reveal) GRP.reveal=p.reveal; if(typeof p.codes==="boolean") GRP.codes=p.codes; }
    else if(p.t==="set" && p.g===GRP.n){ const c=fromCode("G"+p.g+"-"+p.ch); if(c){ GRP.choices=c.ch; GRP.unlocked=Math.max(GRP.unlocked,doneCount(c.ch)); } }
    else if(p.t==="choice" && p.g===GRP.n){ GRP.choices[p.r-1]=p.c; }
    else return;
    saveGrp(); softRender();
  }
}

/* ===================== charts ===================== */
function lineChart(ch){
  const W=560,H=250,P=36, xs=i=>P+i*((W-2*P)/5), ys=v=>H-P-(v-30)/(120-30)*(H-2*P);
  const series=[["T","Target","#1E8C7B"],["C","Capacity","#F26A44"],["Tr","Trust","#4A86E8"]];
  let g="";
  [40,60,80,100,120].forEach(v=>g+=`<line x1="${P}" x2="${W-P}" y1="${ys(v)}" y2="${ys(v)}" stroke="#DCE6F7"/><text x="4" y="${ys(v)+4}" font-size="11" fill="#5B6485">${v}</text>`);
  for(let i=0;i<=5;i++) g+=`<text x="${xs(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="#5B6485">${i===0?"Start":"Day "+DATA.rounds[i-1].day}</text>`;
  series.forEach(([k,name,col])=>{
    const pts=[0,1,2,3,4,5].map(i=>`${xs(i)},${ys(totals(ch,i)[k])}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3"/>`;
    [0,1,2,3,4,5].forEach(i=>g+=`<circle cx="${xs(i)}" cy="${ys(totals(ch,i)[k])}" r="4" fill="${col}"/>`);
  });
  const lg=series.map(([k,n,c],i)=>`<rect x="${P+i*100}" y="6" width="12" height="12" fill="${c}"/><text x="${P+i*100+16}" y="16" font-size="12">${n}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px">${g}${lg}</svg>`;
}
function barChart(groups){
  const cols=[["T","Target","#1E8C7B"],["C","Capacity","#F26A44"],["Tr","Trust","#4A86E8"],["R","Real Target","#080828"]];
  return `<div class="grid g2">`+groups.map(([n,ch])=>{
    const t=totals(ch,5);
    return `<div class="card"><h3>Group ${n}</h3><div class="bar">${cols.map(([k,l,c])=>`<div style="height:${Math.max(2,t[k]*1.1)}px;background:${c}" title="${l} ${t[k]}"></div>`).join("")}</div>
    <div class="note">${cols.map(([k,l,c])=>`<span style="color:${c};font-weight:700">${l} ${t[k]}</span>`).join(" · ")}</div></div>`;
  }).join("")+`</div>`;
}

function facScore(proj){
  const groups = Array.from({length:FAC.groups},(_,i)=>i+1);
  const showHidden = !proj || (FAC.cur>=FAC.reveal);
  const rows = groups.map(n=>{
    const ch=facChoices(n), upToT=Math.min(FAC.cur,5), upToHidden = FAC.cur>5 ? 5 : FAC.cur-1;
    const tT = totals(ch, upToT), tH = totals(ch, Math.max(0,upToHidden)), full = totals(ch,5);
    const T = proj ? tT.T : full.T;
    const C = proj ? (showHidden?tH.C:"?") : full.C, Tr = proj ? (showHidden?tH.Tr:"?") : full.Tr;
    const Co = proj ? (showHidden?BASE.Co:"?") : BASE.Co;
    const R = proj ? (FAC.cur>5 ? full.R : "?") : (doneCount(ch)?full.R:"—");
    return `<tr><td class="lab">Group ${n}</td><td><b>${T}%</b></td><td>${C}${C==="?"?"":"%"}</td><td>${Tr}${Tr==="?"?"":"%"}</td><td>${Co}${Co==="?"?"":"%"}</td><td><b>${R}${(R==="?"||R==="—")?"":"%"}</b></td><td class="note">${doneCount(ch)}/5</td></tr>`;

  return `<div class="grid g4">${tile("Target attainment",tT.T,false,"visible from the start")}${tile("Team capacity",tH.C,!hiddenOK,hiddenOK?"as of the start of this day":"hidden for now")}${tile("Customer continuity",BASE.Co,!hiddenOK,"")}${tile("Team trust",tH.Tr,!hiddenOK,hiddenOK?"as of the start of this day":"hidden for now")}</div>`;
}

  const groups=Array.from({length:FAC.groups},(_,i)=>[i+1,facChoices(i+1)]).filter(([n,ch])=>doneCount(ch)>0);
  if(!groups.length) return shell(`<h1>Compare groups (1.1)</h1><div class="card"><p>No choices entered yet. Enter or import them in the Facilitator console.</p></div>`, "#/compare");
  const rows=groups.map(([n,ch])=>{const t=totals(ch,5);return `<tr><td class="lab">Group ${n}</td><td>${ch.map(c=>c||"—").join(" ")}</td><td>${t.T}%</td><td>${t.C}%</td><td>${t.Tr}%</td><td><b>${t.R}%</b></td></tr>`;}).join("");
  const best=[...groups].sort((a,b)=>totals(b[1],5).T-totals(a[1],5).T)[0], low=[...groups].sort((a,b)=>totals(a[1],5).C-totals(b[1],5).C)[0];
  return shell(`<h1>Compare groups</h1><p class="lead">Use this screen for the Performance Aftermath debrief.</p>
  <div class="card"><div class="scroll"><table><tr><th></th><th>Choices (Day 5 → 1)</th><th>Target</th><th>Capacity</th><th>Trust</th><th>Real Target</th></tr>${rows}</table></div>
  <p class="note">Highest Target: Group ${best[0]} (${totals(best[1],5).T}%). Lowest Capacity: Group ${low[0]} (${totals(low[1],5).C}%).</p></div>
  ${barChart(groups)}
  <div class="grid g2"><div class="card"><h2>WHAT?</h2><ul><li>What decisions did we make?</li><li>What happened to the target?</li><li>What happened to capacity and trust?</li></ul></div>
  <div class="card"><h2>SO WHAT?</h2><ul><li>Which decisions looked successful at first but became expensive later?</li><li>What leadership behavior did we overuse?</li><li>What did we stop doing because of pressure?</li></ul></div>
  <div class="card"><h2>NOW WHAT?</h2><ul><li>What should a sales manager monitor besides target attainment?</li><li>Which behavior would you change if you replayed the simulation?</li><li>How can a leader create pressure without draining the system?</li></ul></div></div>
  <div class="callout">Achieved performance is not the same as sustained performance. If the team hits the target but loses the capacity to repeat it, the business may be paying for performance twice.</div>`, "#/compare");
}

/* ===================== router + events ===================== */
let SHOW_RESULT=false;
const facOK = () => sessionStorage.getItem("l5.ok")==="1";
function route(){
  const raw=location.hash||"#/"; const [path,qs]=raw.split("?"); const q=Object.fromEntries(new URLSearchParams(qs||""));
  let html;
  if((path==="#/facilitator"||path==="#/compare") && !facOK()){ syncStop(); $("#app").innerHTML=viewGate(path); const i=$("[data-act=pin]"); if(i) i.focus(); return; }
  if(path==="#/facilitator"||path==="#/compare") syncStart(FAC.session,"fac");
  else if((path==="#/group"||path==="#/aftermath") && GRP.n && GRP.session) syncStart(GRP.session,"group");
  else syncStop();
  if(path==="#/facilitator") html=viewFacilitator();
  else if(path==="#/group") html=SHOW_RESULT && GRP.n && doneCount(GRP.choices)>0 ? viewResult() : viewGroup(q);
  else if(path==="#/aftermath") html=viewAftermath();
  else if(path==="#/compare") html=viewCompare();
  else html=viewHome();
  $("#app").innerHTML=html; setStatus(SYNC.status);
}
window.addEventListener("hashchange",()=>{ SHOW_RESULT=false; route(); });
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="copycode"){ copy(toCode(+b.dataset.g, facChoices(+b.dataset.g)), b); return; }
  if(a==="copylink"){ copy($(".code[style*='break-all']").textContent, b); return; }
  if(a==="opencur"){ FAC.cur=+b.dataset.v; saveFac(); route(); syncSend({t:"cur",cur:FAC.cur}); syncSend({t:"settings",reveal:FAC.reveal,codes:FAC.codes}); return; }
  if(a==="pinok"){ if($("[data-act=pin]").value.trim()===FAC_PIN){ sessionStorage.setItem("l5.ok","1"); location.hash=b.dataset.target; route(); } else $("#pinmsg").textContent="Wrong code."; return; }
  if(a==="newsession"){ if(confirm("Create a new session code? Groups will need the new link.")){ FAC.session=randSession(); saveFac(); syncStop(); route(); } return; }
  if(a==="proj"){ FAC.proj=!FAC.proj; saveFac(); route(); return; }
  if(a==="apply"){ const lines=$("[data-act=paste]").value.split(/\n/); let ok=0; lines.forEach(l=>{const c=fromCode(l); if(c && c.n>=1 && c.n<=8){ FAC.groups=Math.max(FAC.groups,c.n); FAC.choices[c.n]=c.ch; ok++; }}); saveFac(); route(); if(!ok) alert("No valid codes found. Use the form G3-BCA."); else Object.keys(FAC.choices).forEach(g=>syncSend({t:"set",g:+g,ch:FAC.choices[g].map(x=>x||"-").join("")})); return; }
  if(a==="export"){ copy(JSON.stringify(FAC), b); return; }
  if(a==="reset"){ if(confirm("Reset the whole facilitator session? A new session code is created.")){ FAC={session:randSession(),groups:5,cur:1,reveal:REVEAL_DEFAULT,codes:true,proj:false,choices:{},online:{}}; saveFac(); syncStop(); route(); } return; }
  if(a==="join"){ const n=+$("[data-act=gnum]").value, s=$("[data-act=gsession]").value.trim(); if(!s){ alert("Enter the session code."); return; } GRP={n,session:s,reveal:GRP.reveal||REVEAL_DEFAULT,codes:GRP.codes!==false,choices:[],unlocked:0,notes:{},sent:{}}; saveGrp(); route(); syncSend({t:"hello",g:n}); return; }
  if(a==="gcopy"){ copy(toCode(GRP.n,GRP.choices), b); return; }
  if(a==="gleave"){ if(confirm("Leave this group and clear your choices on this device?")){ GRP={n:null,session:GRP.session,reveal:GRP.reveal,codes:GRP.codes,choices:[],unlocked:0,notes:{}}; saveGrp(); route(); } return; }
  if(a==="gsync"){ const s=prompt("Paste the code from your facilitator (like G3-BCA):"); const c=fromCode(s); if(c){ GRP.choices=c.ch; GRP.unlocked=Math.max(GRP.unlocked,doneCount(c.ch)+(GRP.codes?0:1)); saveGrp(); route(); } else if(s) alert("That code is not valid."); return; }
  if(a==="unlock"){ const r=doneCount(GRP.choices)+1, v=$("[data-act=gcode]").value.trim(); if(!GRP.codes || v===roundCode(GRP.session,r)){ GRP.unlocked=r; saveGrp(); route(); } else $("#gmsg").textContent="That code is not right. Check with your facilitator."; return; }
  if(a==="pick"){ GRP.pick=b.dataset.l; saveGrp(); route(); return; }
  if(a==="lock"){ const i=doneCount(GRP.choices); GRP.choices[i]=GRP.pick; const letter=GRP.pick; GRP.pick=null; saveGrp(); SHOW_RESULT=true; route(); syncSend({t:"choice",g:GRP.n,r:i+1,c:letter}).then(ok=>{ GRP.sent=GRP.sent||{}; GRP.sent[i+1]=!!ok; saveGrp(); if(SHOW_RESULT) route(); }); return; }
  if(a==="next"){ e.preventDefault(); SHOW_RESULT=false; route(); return; }
  if(a==="copynotes"){ const N=GRP.notes; copy(`Group ${GRP.n}\nWHAT?\n${N.what||""}\n\nSO WHAT?\n${N.sowhat||""}\n\nNOW WHAT?\n${N.nowwhat||""}\n\nKEEP: ${N.keep||""}\nSTOP: ${N.stop||""}\nSTART: ${N.start||""}`, b); return; }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(a==="cell"){ const g=+el.dataset.g; facChoices(g)[+el.dataset.i]=el.value||null; saveFac(); route(); syncSend({t:"set",g,ch:facChoices(g).map(x=>x||"-").join("")}); }
  else if(a==="groups"){ FAC.groups=+el.value; saveFac(); route(); }
  else if(a==="session"){ FAC.session=el.value.trim()||randSession(); saveFac(); syncStop(); route(); }
  else if(a==="reveal"){ FAC.reveal=+el.value; saveFac(); route(); syncSend({t:"settings",reveal:FAC.reveal,codes:FAC.codes}); }
  else if(a==="codes"){ FAC.codes=el.value==="1"; saveFac(); route(); syncSend({t:"settings",reveal:FAC.reveal,codes:FAC.codes}); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("[data-act=pin]")) $("[data-act=pinok]").click(); });
document.addEventListener("input",e=>{ const el=e.target.closest("[data-act=note]"); if(el){ GRP.notes[el.dataset.k]=el.value; saveGrp(); } });
window.L5 = {totals, toCode, fromCode, roundCode, topicOf, DATA, get FAC(){return FAC;}, get GRP(){return GRP;}, get SYNC(){return SYNC;}};
route();
</script>
</body>
</html>
